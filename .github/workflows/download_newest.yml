name: download newest

# Controls when the workflow will run
on:
  schedule:
    - cron: '39 * * * *'  # 每10分钟执行一次
  repository_dispatch:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 下载转换工具，jq
    - name: Download jq programs
      run: |
        sudo apt install jq
      continue-on-error: true  # 即使出错也继续执行后续步骤
      
    - name: Use curl to read remote webpage and filter with grep
      run: |
        # 获取 GitHub 仓库某目录最新一次提交里更新的文件名（不需 clone）
        # 依赖：curl、jq
        # 可选：设置环境变量 GITHUB_TOKEN 以提升 API 速率限制
        
        set -euo pipefail
        
        REPO="kort0881/vpn-key-vless"
        PATH_IN_REPO="githubmirror"
        
        API="https://api.github.com"
        UA="curl/latest"
        AUTH_HEADER=""
        if [[ -n "${GITHUB_TOKEN:-}" ]]; then
          AUTH_HEADER="-H Authorization: Bearer ${GITHUB_TOKEN}"
        fi
        
        # 1) 获取针对指定目录的最新提交的 sha
        latest_sha=$(
          curl -sS -H "User-Agent: ${UA}" ${AUTH_HEADER} \
            "${API}/repos/${REPO}/commits?path=${PATH_IN_REPO}&per_page=1" \
          | jq -r '.[0].sha'
        )
        
        if [[ -z "${latest_sha}" || "${latest_sha}" == "null" ]]; then
          echo "未找到该目录的最新提交（可能是路径不匹配或 API 受限）。"
          exit 1
        fi
        
        # 2) 用 sha 获取提交详情里的文件列表
        # 提交详情才包含 .files 字段，列表接口不包含
        latest_file=$(
          curl -sS -H "User-Agent: ${UA}" ${AUTH_HEADER} \
            "${API}/repos/${REPO}/commits/${latest_sha}" \
          | jq -r '.files[].filename' \
          | grep -E "^${PATH_IN_REPO}/" \
          | head -n 1
        )
        
        if [[ -z "${latest_file}" ]]; then
          echo "该提交未修改 ${PATH_IN_REPO}/ 下的文件，或未返回文件列表。"
          exit 1
        fi
        
        echo "最新更新的文件是: ${latest_file}"
  
        curl -s "https://raw.githubusercontent.com/kort0881/vpn-key-vless/refs/heads/main/$latest_file" -o "./sub/nodes_v1.txt"  # 示例：下载内容到文件
        
      shell: bash
      continue-on-error: true  # 即使出错也继续执行后续步骤

    - name: Download clash config
      run: |
        CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
        DOWNLOAD_URL="https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/protocol/hysteria2/${CONFIG_FILE}"
        echo "Downloading from: $DOWNLOAD_URL"
        curl -fL "$DOWNLOAD_URL" -o "$CONFIG_FILE"
        if [ ! -s "$CONFIG_FILE" ]; then
          echo "Failed to download or empty file: $CONFIG_FILE"
          exit 1
        fi
        echo "Downloaded $(wc -l < "$CONFIG_FILE") lines"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
    - name: Clean Clash config
      id: clean
      run: |
        CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
        CLEAN_FILE="sub/${CONFIG_FILE%.yaml}.clean.yaml"
        #mkdir -p sub
        python ./clean_clash_config.py "$CONFIG_FILE" "$CLEAN_FILE"
    - name: Show diff
      run: |
        CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
        CLEAN_FILE="sub/${CONFIG_FILE%.yaml}.clean.yaml"
        if [ -f "$CLEAN_FILE" ]; then
          echo "=== Diff ==="
          diff -u "$CONFIG_FILE" "$CLEAN_FILE" || true
        fi

    - name: Upload cleaned config as artifact
      uses: actions/upload-artifact@v4
      with:
        name: cleaned-clash-config
        path: "*.clean.yaml"
        retention-days: 7
      
        
    - name: 提交并推送更改
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        echo "1-检查时间：$(TZ=UTC-8 date +%Y-%m-%d" "%H:%M:%S)" > status
        git add .
        git commit -m "节点更新时间：$(TZ=UTC-8 date +%Y-%m-%d" "%H:%M:%S)"
        git push
