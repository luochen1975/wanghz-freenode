name: sb config conversion

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:   
    - cron: '18 */2 * * *'   #国际标准时间，北京时间+8，即下午1点钟
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Conversion:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: startSubconverter
        run: |
          docker rm -f subconverter 2>/dev/null || true
          docker pull asdlokj1qpi23/subconverter:latest
      
          docker run -d \
            --name subconverter \
            -p 25500:25500 \
            asdlokj1qpi23/subconverter:latest
      
          # 等待服务启动
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:25500/version; then
              echo "Subconverter is ready"
              break
            fi
            sleep 2
          done
      
          docker ps -a
          docker logs --tail 50 subconverter
            
      - name: testSubconverter
        run: |
          curl -v --connect-timeout 5 --max-time 15 http://127.0.0.1:25500/version


      - name: Diagnose single VLESS node
        shell: bash
        run: |
          curl -fLsS --retry 3 \
            'https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/5.1.txt' \
            -o /tmp/source.txt
          python3 - <<'PY'
          from pathlib import Path
          import html
      
          content = Path("/tmp/source.txt").read_text(encoding="utf-8-sig")
          nodes = [
              html.unescape(line.strip())
              for line in content.splitlines()
              if line.strip().startswith("vless://")
          ]
      
          if not nodes:
              raise SystemExit("No VLESS nodes found")
      
          # 输出一条节点用于诊断，隐藏用户名等信息
          node = nodes[0]
          from urllib.parse import urlsplit, parse_qs
          parsed = urlsplit(node)
          print("Scheme:", parsed.scheme)
          print("Host:", parsed.hostname)
          print("Port:", parsed.port)
          print("Query parameters:", sorted(parse_qs(parsed.query).keys()))
      
          Path("/tmp/one-vless.txt").write_text(
              node + "\n", encoding="utf-8"
          )
          PY
      
          curl -fsS http://127.0.0.1:25500/version
      
          # 将单节点作为 data URI 传入，避免远程订阅下载干扰诊断
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import subprocess
      
          node = Path("/tmp/one-vless.txt").read_text().strip()
          url = "data:text/plain;charset=utf-8," + quote(node + "\n")
      
          result = subprocess.run([
              "curl", "-sS", "-G",
              "-o", "/tmp/one-result.yaml",
              "-w", "HTTP status: %{http_code}\\n",
              "http://127.0.0.1:25500/sub",
              "--data-urlencode", "target=clash",
              "--data-urlencode", "url=" + url
          ])
          if result.returncode:
              raise SystemExit(result.returncode)
      
          print(Path("/tmp/one-result.yaml").read_text()[:1500])
          PY
          docker logs --tail 40 subconverter


        continue-on-error: true  # 即使出错也继续执行后续步骤

      
      - name: Pull changes
        run: |
          git config --global user.email "action@gmail.com"
          git config --global user.name "action"
          git pull origin main
      #Commit
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: new config   
