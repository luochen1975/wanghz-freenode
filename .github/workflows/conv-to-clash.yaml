name: sb config conversion

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:   
    - cron: '18 */2 * * *'   #国际标准时间，北京时间+8，即下午1点钟
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Conversion:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: startSubconverter
        run: |
          docker run -d --name subconverter \
            -p 25500:25500 \
            ghcr.io/metacubex/subconverter:latest
          
          sleep 3
          docker ps -a
          docker logs subconverter
          docker inspect subconverter \
            --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}'
            
      - name: testSubconverter
        run: |
          curl -v --connect-timeout 5 --max-time 15 http://127.0.0.1:25500/version

      - name: Convert subscription to Clash
        shell: bash
        run: |
          set -euo pipefail
      
          SOURCE_URL="https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/3.1.txt"
      
          mkdir -p ./sub
      
          # 1. 下载原始订阅
          curl -fLsS --retry 3 "$SOURCE_URL" -o /tmp/source.txt
      
          # 2. 修复 HTML 转义
          python3 - <<'PY'
          from pathlib import Path
      
          src = Path("/tmp/source.txt")
          dst = Path("/tmp/source-fixed.txt")
      
          content = src.read_text(encoding="utf-8-sig")
          count = content.count("&amp;")
          content = content.replace("&amp;", "&")
          dst.write_text(content, encoding="utf-8")
      
          print(f"Replaced {count} HTML entities")
          print(f"VLESS nodes: {sum(line.startswith('vless://') for line in content.splitlines())}")
          PY
      
          # 3. 将修复后的文件复制到容器内部
          docker cp /tmp/source-fixed.txt subconverter:/tmp/source-fixed.txt
      
          # 4. 使用容器内文件作为转换输入
          curl -sS --get \
            --max-time 120 \
            --data-urlencode 'target=clash' \
            --data-urlencode 'url=/tmp/source-fixed.txt' \
            -o /tmp/converted.yaml \
            -w 'HTTP status: %{http_code}\n' \
            http://127.0.0.1:25500/sub
      
          # 5. 检查结果，失败时打印错误正文
          if grep -q '^proxies:' /tmp/converted.yaml; then
            cp /tmp/converted.yaml ./sub/r3.1.yaml
            echo "Conversion succeeded"
            grep -c '^[[:space:]]*- name:' ./sub/r3.1.yaml || true
          else
            echo "Conversion failed; response body:"
            head -c 3000 /tmp/converted.yaml
            echo
            docker logs --tail 100 subconverter
            exit 1
          fi

        continue-on-error: true  # 即使出错也继续执行后续步骤

      
      - name: Pull changes
        run: |
          git config --global user.email "action@gmail.com"
          git config --global user.name "action"
          git pull origin main
      #Commit
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: new config   
