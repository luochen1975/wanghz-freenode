name: sb config conversion

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:   
    - cron: '18 */2 * * *'   #国际标准时间，北京时间+8，即下午1点钟
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Conversion:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: startSubconverter
        run: |
          docker rm -f subconverter 2>/dev/null || true
      
          docker pull aethersailor/subconverter-extended:latest
      
          docker run -d \
            --name subconverter \
            -p 25500:25500 \
            aethersailor/subconverter-extended:latest
      
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:25500/version; then
              echo "SubConverter-Extended is ready"
              exit 0
            fi
            sleep 2
          done
      
          docker logs --tail 100 subconverter
          exit 1
                  
      - name: testSubconverter
        run: |
          curl -v --connect-timeout 5 --max-time 15 http://127.0.0.1:25500/version

      - name: Convert subscription
        shell: bash
        run: |
          mkdir -p ./sub
      
          SOURCE_URL="https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub"
      
          curl -fLsS --retry 3 --max-time 180 \
            --get 'http://127.0.0.1:25500/sub' \
            --data-urlencode 'target=clash' \
            --data-urlencode "url=$SOURCE_URL" \
            --data-urlencode 'list=true' \
            -o ./sub/pawdroid.yaml
      
          if ! grep -qE '^(proxies|proxy-providers):' ./sub/pawdroid.yaml; then
            echo "No valid Clash nodes or providers generated"
            head -c 2000 ./sub/pawdroid.yaml
            echo
            docker logs --tail 100 subconverter
            exit 1
          fi
      
          echo "Conversion succeeded"
          ls -lh ./sub/pawdroid.yaml

          SOURCE_URL32="https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/3.2.txt"
      
          curl -fLsS --retry 3 --max-time 180 \
            --get 'http://127.0.0.1:25500/sub' \
            --data-urlencode 'target=clash' \
            --data-urlencode "url=$SOURCE_URL32" \
            --data-urlencode 'list=true' \
            -o ./sub/r3.2.yaml
      
          if ! grep -qE '^(proxies|proxy-providers):' ./sub/r3.2.yaml; then
            echo "No valid Clash nodes or providers generated"
            head -c 2000 ./sub/r3.2.yaml
            echo
            docker logs --tail 100 subconverter
            exit 1
          fi
      
          echo "Conversion succeeded"
          ls -lh ./sub/r3.2.yaml

          SOURCE_URL41="https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/4.1.txt"
      
          curl -fLsS --retry 3 --max-time 180 \
            --get 'http://127.0.0.1:25500/sub' \
            --data-urlencode 'target=clash' \
            --data-urlencode "url=$SOURCE_URL41" \
            --data-urlencode 'list=true' \
            -o ./sub/r4.1.yaml
      
          if ! grep -qE '^(proxies|proxy-providers):' ./sub/r4.1.yaml; then
            echo "No valid Clash nodes or providers generated"
            head -c 2000 ./sub/r4.1.yaml
            echo
            docker logs --tail 100 subconverter
            exit 1
          fi
      
          echo "Conversion succeeded"
          ls -lh ./sub/r4.1.yaml      

          SOURCE_URL51="https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/5.1.txt"
      
          curl -fLsS --retry 3 --max-time 180 \
            --get 'http://127.0.0.1:25500/sub' \
            --data-urlencode 'target=clash' \
            --data-urlencode "url=$SOURCE_URL51" \
            --data-urlencode 'list=true' \
            -o ./sub/r5.1.yaml
      
          if ! grep -qE '^(proxies|proxy-providers):' ./sub/r5.1.yaml; then
            echo "No valid Clash nodes or providers generated"
            head -c 2000 ./sub/r5.1.yaml
            echo
            docker logs --tail 100 subconverter
            exit 1
          fi
      
          echo "Conversion succeeded"
          ls -lh ./sub/r5.1.yaml
          
        continue-on-error: true  # 即使出错也继续执行后续步骤

      
      - name: Pull changes
        run: |
          git config --global user.email "action@gmail.com"
          git config --global user.name "action"
          git pull origin main
      #Commit
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: new config   
