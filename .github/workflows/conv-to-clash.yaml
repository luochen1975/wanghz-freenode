name: sb config conversion

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:   
    - cron: '18 */2 * * *'   #国际标准时间，北京时间+8，即下午1点钟
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Conversion:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: startSubconverter
        run: |
          docker run -d --name subconverter \
            -p 25500:25500 \
            ghcr.io/metacubex/subconverter:latest
          
          sleep 3
          docker ps -a
          docker logs subconverter
          docker inspect subconverter \
            --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}'
            
      - name: testSubconverter
        run: |
          curl -v --connect-timeout 5 --max-time 15 http://127.0.0.1:25500/version

      - name: convert to clash configs
        run: |
          #curl -fL --retry 3 -o ./sub/r3.1.yaml "http://127.0.0.1:25500/sub?target=clash&url=https%3A%2F%2Fraw.githubusercontent.com%2FHidashimora%2Ffree-vpn-anti-rkn%2Fmain%2Fconfigs%2F3.1.txt"
          mkdir -p ./sub
      
          URL='https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/3.1.txt'
      
          echo "=== Test source subscription ==="
          curl -fLsS --max-time 30 "$URL" -o /tmp/source.txt
          echo "Source size:"
          wc -c /tmp/source.txt
          head -c 200 /tmp/source.txt
          echo
          echo "VLESS 节点数量："
          grep -c '^vless://' /tmp/source.txt || true
          
          echo "HTML 转义字符数量："
          grep -oF '&amp;' /tmp/source.txt | wc -l
          
          echo "其他协议数量："
          grep -Ec '^(vmess|ss|ssr|trojan|hysteria2)://' /tmp/source.txt || true

          # 复制到容器中，避免修改 Runner 上的原始文件
          docker cp /tmp/source.txt subconverter:/tmp/source.txt
          
          # 只替换 HTML 转义的参数分隔符
          docker exec subconverter sh -c \
            "sed -i 's/\\&amp;/\\\&/g' /tmp/source.txt"
          
          # 让 Subconverter 读取容器内部的本地文件
          curl -sS -G \
            -o /tmp/converted.yaml \
            -w 'HTTP status: %{http_code}\n' \
            'http://127.0.0.1:25500/sub' \
            --data-urlencode 'target=clash' \
            --data-urlencode 'url=/tmp/source.txt'
          
          head -n 30 /tmp/converted.yaml
          
      
          echo "=== Test conversion ==="
          curl -sS -L --max-time 120 \
            -D /tmp/headers.txt \
            -o /tmp/response.txt \
            -w '\nHTTP status: %{http_code}\n' \
            --get 'http://127.0.0.1:25500/sub' \
            --data-urlencode 'target=clash' \
            --data-urlencode "url=$URL"
      
          echo "=== Response headers ==="
          cat /tmp/headers.txt
      
          echo "=== Response body ==="
          head -c 3000 /tmp/response.txt
          echo
      
          echo "=== Subconverter logs ==="
          docker logs --tail 100 subconverter

        continue-on-error: true  # 即使出错也继续执行后续步骤

      
      - name: Pull changes
        run: |
          git config --global user.email "action@gmail.com"
          git config --global user.name "action"
          git pull origin main
      #Commit
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: new config   
