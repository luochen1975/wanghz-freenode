name: sb config conversion

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:   
    - cron: '18 */2 * * *'   #国际标准时间，北京时间+8，即下午1点钟
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Conversion:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: startSubconverter
        run: |
          docker run -d --name subconverter \
            -p 7898:7899 \
            ghcr.io/metacubex/subconverter:latest
          curl http://localhost:25500/version

      - name: convert to clash configs
        run: |
          curl -fL --retry 3 -o ./sub/r3.1.yaml "http://127.0.0.1:7898/sub?target=clash&url=https%3A%2F%2Fraw.githubusercontent.com%2FHidashimora%2Ffree-vpn-anti-rkn%2Fmain%2Fconfigs%2F3.1.txt"
 
        continue-on-error: true  # 即使出错也继续执行后续步骤

      
      - name: Pull changes
        run: |
          git config --global user.email "action@gmail.com"
          git config --global user.name "action"
          git pull origin main
      #Commit
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: new config   
