name: sb config conversion

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:   
    - cron: '18 */2 * * *'   #国际标准时间，北京时间+8，即下午1点钟
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Conversion:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main

      - name: startSubconverter
        run: |
          # run the container detached, forward internal port 25500 to host port 25500
          docker run -d --restart=always -p 2550:25500 tindy2013/subconverter:latest
          # then check its status
          #curl http://localhost:2550/version
          # if you see `subconverter vx.x.x backend` then the container is up and running
          docker ps
          sleep 5
      #下载clash配置
      - name: convert to clash configs
        run: |
          URL="https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/3.1.txt"
          curl -o ./sub/r3.1.yaml "http://127.0.0.1:2550/sub?target=clash&url=${URL}"
          
        continue-on-error: true  # 即使出错也继续执行后续步骤
      # 下载转换工具，再将上边3个clash配置转换为sb配置

      
      - name: Pull changes
        run: |
          git config --global user.email "action@gmail.com"
          git config --global user.name "action"
          git pull origin main
      #Commit
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: new config   
