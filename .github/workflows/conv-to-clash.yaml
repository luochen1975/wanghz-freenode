name: sb config conversion

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:   
    - cron: '18 */2 * * *'   #国际标准时间，北京时间+8，即下午1点钟
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Conversion:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: startSubconverter
        run: |
          docker rm -f subconverter 2>/dev/null || true
          docker pull asdlokj1qpi23/subconverter:latest
      
          docker run -d \
            --name subconverter \
            -p 25500:25500 \
            asdlokj1qpi23/subconverter:latest
      
          # 等待服务启动
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:25500/version; then
              echo "Subconverter is ready"
              break
            fi
            sleep 2
          done
      
          docker ps -a
          docker logs --tail 50 subconverter
            
      - name: testSubconverter
        run: |
          curl -v --connect-timeout 5 --max-time 15 http://127.0.0.1:25500/version

      - name: Convert subscription to Clash
        shell: bash
        run: |
          SOURCE_URL='https://raw.githubusercontent.com/Hidashimora/free-vpn-anti-rkn/main/configs/3.1.txt'
          
          curl -sS -G \
            --max-time 120 \
            -o /tmp/result.txt \
            -w 'HTTP status: %{http_code}\n' \
            'http://127.0.0.1:25500/sub' \
            --data-urlencode 'target=clash' \
            --data-urlencode "url=$SOURCE_URL"
          
          head -c 1000 /tmp/result.txt

        continue-on-error: true  # 即使出错也继续执行后续步骤

      
      - name: Pull changes
        run: |
          git config --global user.email "action@gmail.com"
          git config --global user.name "action"
          git pull origin main
      #Commit
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: new config   
