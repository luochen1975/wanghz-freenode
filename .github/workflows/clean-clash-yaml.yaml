name: Clean Clash Config

on:
  push:
    paths:
      - 'clash-0001.yaml'
      - 'clash-*.yaml'
  pull_request:
    paths:
      - 'clash-0001.yaml'
      - 'clash-*.yaml'
  schedule:   
    - cron: '36 */2 * * *'   #每小时运行 
  repository_dispatch:    
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Clash config file to clean'
        required: true
        default: 'clash-0001.yaml'

permissions:
  contents: write

jobs:
  clean-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false

      - name: Download clash config
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
          DOWNLOAD_URL="https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/protocol/hysteria2/${CONFIG_FILE}"
          echo "Downloading from: $DOWNLOAD_URL"
          curl -fL "$DOWNLOAD_URL" -o "$CONFIG_FILE"
          if [ ! -s "$CONFIG_FILE" ]; then
            echo "Failed to download or empty file: $CONFIG_FILE"
            exit 1
          fi
          echo "Downloaded $(wc -l < "$CONFIG_FILE") lines"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Clean Clash config
        id: clean
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
          CLEAN_FILE="sub/${CONFIG_FILE%.yaml}.clean.yaml"
          #mkdir -p sub
          python ./clean_clash_config.py "$CONFIG_FILE" "$CLEAN_FILE"

      - name: Show diff
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
          CLEAN_FILE="sub/${CONFIG_FILE%.yaml}.clean.yaml"
          if [ -f "$CLEAN_FILE" ]; then
            echo "=== Diff ==="
            diff -u "$CONFIG_FILE" "$CLEAN_FILE" || true
          fi

      - name: Download clash config 2
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
          DOWNLOAD_URL="https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/refs/heads/main/output/protocol/trojan/${CONFIG_FILE}"
          echo "Downloading from: $DOWNLOAD_URL"
          curl -fL "$DOWNLOAD_URL" -o "$CONFIG_FILE"
          if [ ! -s "$CONFIG_FILE" ]; then
            echo "Failed to download or empty file: $CONFIG_FILE"
            exit 1
          fi
          echo "Downloaded $(wc -l < "$CONFIG_FILE") lines"

      - name: Clean Clash config 2
        id: clean
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
          CLEAN_FILE="sub/${CONFIG_FILE%.yaml}.trojan.yaml"
          #mkdir -p sub
          python ./clean_clash_config.py "$CONFIG_FILE" "$CLEAN_FILE"


      - name: 提交并推送更改
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          echo "1-检查时间：$(TZ=UTC-8 date +%Y-%m-%d" "%H:%M:%S)" > status
          git add .
          git commit -m "节点更新时间：$(TZ=UTC-8 date +%Y-%m-%d" "%H:%M:%S)"
          git push

      - name: Upload cleaned config as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-clash-config
          path: "sub/*.yaml"
          retention-days: 7
